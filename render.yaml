# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the fundraising platform. Add the custom domain spin.yismachmosheofwoodmere.com
# in the Render dashboard (Settings > Custom Domains) after the first deploy.
# Payments: TEST keys = test mode. Real charges need LIVE keys (rk_live_/pk_live_) AND RAFFLE_LIVE_PAYMENTS=1; any mix is refused at startup.
services:
  - type: web
    name: yismach-spin
    runtime: python
    plan: starter            # a persistent disk needs a paid instance
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 60
    healthCheckPath: /api/status
    autoDeploy: true         # every update pushed to GitHub deploys automatically
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RAFFLE_ENV
        value: production
      - key: RAFFLE_PROXY_FIX
        value: "1"
      - key: RAFFLE_SECURE_COOKIES
        value: "1"
      - key: RAFFLE_DB
        value: /var/data/raffle.sqlite
      - key: RAFFLE_UPLOADS
        value: /var/data/uploads
      - key: RAFFLE_ARCHIVE
        value: /var/data/archive
      - key: RAFFLE_SECRET_KEY
        generateValue: true
      - key: RAFFLE_ADMIN_TOKEN
        generateValue: true
      - key: RAFFLE_ADMIN_USER
        value: admin
      - key: RAFFLE_ADMIN_PASSWORD     # enter in the Render dashboard (12+ characters)
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "1"
      - key: SMTP_USER
        value: yismachspin@gmail.com
      - key: SMTP_FROM
        value: Yismach Moshe of North Woodmere <yismachspin@gmail.com>
      - key: SMTP_PASSWORD             # Gmail app password, entered in the Render dashboard
        sync: false
      - key: STRIPE_SECRET_KEY         # rk_test_/sk_test_ (test) or rk_live_/sk_live_ (live), entered in the Render dashboard
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY    # pk_test_... or pk_live_...
        sync: false
